name: Päivitä tuotteiden hinnat

on:
  schedule:
    # Ajetaan joka päivä klo 06:00 UTC (08:00/09:00 Suomen aikaa)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Hae repositorio
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: pip install -r requirements.txt

      - name: Aja hintaseurantaskripti
        run: python scraper.py

      - name: Tallenna päivitetyt hinnat repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "chore: päivitä hinnat $(date -u +'%Y-%m-%d')"
          git push
